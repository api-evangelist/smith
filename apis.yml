description: Smith (GoSmith, Inc.) was an app- and web-based marketplace for home-improvement and remodeling
  services, founded in 2012 in Sunnyvale, California and part of the 500 Startups (500 Global) accelerator's
  8th batch in 2014. Homeowners listed a project to receive quotes from up to five researched and vetted
  local contractors, with scheduling and payment tooling for the professionals. As of this enrichment pass
  the gosmith.com domain still resolves (AWS/Google Workspace DNS) but serves no website (HTTP/HTTPS connections
  time out), and the company exposes no public developer API, documentation, or SDKs.
